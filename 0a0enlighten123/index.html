<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tumblr Dual Feed + Search</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b0b0b;
    color: white;
}

header {
    text-align: center;
    padding: 15px;
    background: #111;
    position: sticky;
    top: 0;
}

.container {
    display: flex;
    height: calc(100vh - 70px);
}

.column {
    flex: 1;
    overflow-y: auto;
    padding: 15px;
    border-right: 1px solid #222;
}

.column:last-child {
    border-right: none;
}

h2 {
    text-align: center;
    color: #ffcc66;
}

.post {
    background: #1a1a1a;
    margin-bottom: 12px;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #333;
}

.post-title {
    color: #ff6699;
    font-weight: bold;
    margin-bottom: 8px;
}

small {
    opacity: 0.6;
    display: block;
    margin-bottom: 10px;
}

.buttons {
    display: flex;
    gap: 8px;
}

button {
    flex: 1;
    padding: 6px;
    font-size: 12px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}

.google {
    background: #4285F4;
    color: white;
}

.youtube {
    background: #FF0000;
    color: white;
}
</style>
</head>

<body>

<header>
    <h2>Dual Tumblr Feed + Search Buttons</h2>
</header>

<div class="container">

    <div class="column">
        <h2>cantdanceflynn</h2>
        <div id="feed1">Loading...</div>
    </div>

    <div class="column">
        <h2>cometcrystal</h2>
        <div id="feed2">Loading...</div>
    </div>

</div>

<script>

const feed1 =
    "https://api.rss2json.com/v1/api.json?rss_url=" +
    encodeURIComponent("https://cantdanceflynn.tumblr.com/rss");

const feed2 =
    "https://api.rss2json.com/v1/api.json?rss_url=" +
    encodeURIComponent("https://cometcrystal.tumblr.com/rss");

function createPost(item) {

    const div = document.createElement("div");
    div.className = "post";

    const title = item.title || "Untitled Post";

    div.innerHTML = `
        <div class="post-title">${title}</div>
        <small>${item.pubDate || ""}</small>

        <div class="buttons">
            <button class="google">Google</button>
            <button class="youtube">YouTube</button>
        </div>
    `;

    const googleBtn = div.querySelector(".google");
    const youtubeBtn = div.querySelector(".youtube");

    googleBtn.onclick = () => {
        window.open(
            "https://www.google.com/search?q=" +
            encodeURIComponent(title),
            "_blank"
        );
    };

    youtubeBtn.onclick = () => {
        window.open(
            "https://www.youtube.com/results?search_query=" +
            encodeURIComponent(title),
            "_blank"
        );
    };

    return div;
}

async function loadFeed(url, containerId) {

    try {

        const res = await fetch(url);
        const data = await res.json();

        const container =
            document.getElementById(containerId);

        container.innerHTML = "";

        data.items.forEach(item => {
            container.appendChild(createPost(item));
        });

    } catch (e) {

        console.error(e);

        document.getElementById(containerId).innerHTML =
            "Failed to load posts.";

    }
}

function refreshAll() {
    loadFeed(feed1, "feed1");
    loadFeed(feed2, "feed2");
}

// initial load
refreshAll();

// refresh every 3 seconds
setInterval(refreshAll, 3000);

</script>

</body>
</html>
