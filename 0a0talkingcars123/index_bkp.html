<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Top Down Car Battle + Tumblr Chat</title>
<style>
html,body{margin:0;overflow:hidden;background:#1f1f1f;font-family:Arial;}
canvas{display:block;background:#2b2b2b;}
#damageUI{
    position:absolute;top:10px;right:10px;width:250px;background:rgba(0,0,0,0.75);
    color:white;padding:10px;border-radius:10px;
}
.bar{width:100%;height:22px;background:#333;border-radius:6px;overflow:hidden;margin-top:5px;}
.fill{height:100%;width:100%;background:linear-gradient(90deg,#00ff66,#ffee00,#ff0000);}
</style>
</head>
<body>

<div id="damageUI">
<b>PLAYER DAMAGE</b>
<div class="bar">
<div class="fill" id="damageFill"></div>
</div>
<div style="margin-top:8px;">
Damage: <span id="damageText">0%</span>
</div>
<div style="margin-top:8px;">
Deaths: <span id="deathText">0</span>
</div>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize(){canvas.width=innerWidth;canvas.height=innerHeight;}
resize();
addEventListener("resize",resize);

/* ===== KEYBOARD PLAYER ===== */
const keys = {};
addEventListener("keydown", e=>keys[e.code]=true);
addEventListener("keyup", e=>keys[e.code]=false);

const player={
    x:innerWidth/2,y:innerHeight/2,angle:0,vx:0,vy:0,
    width:42,height:72,damage:0,deaths:0,accel:0.03,turnSpeed:0.05,
    chat:"Hello!"
};

/* ===== ENEMIES ===== */
function makeEnemy(){return {
    x:Math.random()*canvas.width,
    y:Math.random()*canvas.height,
    angle:Math.random()*Math.PI*2,
    vx:0,vy:0,width:42,height:72,
    damage:0,alive:true,respawn:0,fleeing:false,fleeTimer:0,slowTimer:0,
    ramTarget:null,ramTimer:0,
    chat:"Hi!"
};}
const enemies=[];for(let i=0;i<5;i++) enemies.push(makeEnemy());
const props=[];const explosions=[];

/* ===== WRAP ===== */
function wrap(car){if(car.x<0)car.x=canvas.width;if(car.x>canvas.width)car.x=0;
if(car.y<0)car.y=canvas.height;if(car.y>canvas.height)car.y=0;}

/* ===== PLAYER UPDATE ===== */
function updatePlayer(){
    let forward=keys["ArrowUp"];
    let reverse=keys["ArrowDown"];
    let steer=0;if(keys["ArrowLeft"])steer=-1;if(keys["ArrowRight"])steer=1;
    player.angle+=steer*player.turnSpeed;
    let accel=0;if(forward)accel+=player.accel;if(reverse)accel-=player.accel;
    player.vx+=Math.sin(player.angle)*accel*60;
    player.vy+=-Math.cos(player.angle)*accel*60;
    const rx=Math.cos(player.angle),ry=Math.sin(player.angle),sideVel=player.vx*rx+player.vy*ry;
    player.vx-=rx*sideVel*0.2;player.vy-=ry*sideVel*0.2;
    player.vx*=0.985;player.vy*=0.985;
    player.x+=player.vx*0.1;player.y+=player.vy*0.1;
    wrap(player);
}

/* ===== AI UPDATE ===== */
function updateEnemies(){
    enemies.forEach(enemy=>{
        if(!enemy.alive){enemy.respawn--;if(enemy.respawn<=0)Object.assign(enemy,makeEnemy());return;}
        if(Math.random()<0.01){
            const others=enemies.filter(e=>e!==enemy && e.alive);
            if(others.length>0){enemy.ramTarget=others[Math.floor(Math.random()*others.length)];enemy.ramTimer=120+Math.floor(Math.random()*60);}
        }
        let targetX=player.x,targetY=player.y;
        if(enemy.ramTarget && enemy.ramTimer>0){targetX=enemy.ramTarget.x;targetY=enemy.ramTarget.y;enemy.ramTimer--;}else{enemy.ramTarget=null;}
        props.forEach(prop=>{const dx=prop.x-enemy.x,dy=prop.y-enemy.y,dist=Math.hypot(dx,dy);if(dist<100){targetX-=dx*2;targetY-=dy*2;}});
        if(enemy.fleeing){targetX=enemy.x-(player.x-enemy.x);targetY=enemy.y-(player.y-enemy.y);enemy.fleeTimer--; if(enemy.fleeTimer<=0)enemy.fleeing=false;}
        const dx=targetX-enemy.x,dy=targetY-enemy.y,targetAngle=Math.atan2(dx,-dy);
        let diff=targetAngle-enemy.angle;while(diff>Math.PI)diff-=Math.PI*2;while(diff<-Math.PI)diff+=Math.PI*2;
        enemy.angle+=diff*0.04;
        let speedMul=1;if(enemy.slowTimer>0){enemy.slowTimer--;speedMul=0.3;}
        enemy.vx+=Math.sin(enemy.angle)*0.18*speedMul;enemy.vy+=-Math.cos(enemy.angle)*0.18*speedMul;
        const rx=Math.cos(enemy.angle),ry=Math.sin(enemy.angle),sideVel=enemy.vx*rx+enemy.vy*ry;
        enemy.vx-=rx*sideVel*0.2;enemy.vy-=ry*sideVel*0.2;
        enemy.vx*=0.97;enemy.vy*=0.97;
        enemy.x+=enemy.vx;enemy.y+=enemy.vy;
        wrap(enemy);
    });
}

/* ===== COLLISION ===== */
function collide(a,b){
    const dx=b.x-a.x,dy=b.y-a.y,dist=Math.hypot(dx,dy);
    if(dist<58){const nx=dx/(dist||1),ny=dy/(dist||1);
        a.x-=nx*2;a.y-=ny*2;b.x+=nx*2;b.y+=ny*2;a.vx-=nx*2;a.vy-=ny*2;b.vx+=nx*2;b.vy+=ny*2;return true;} return false;}
function damageEnemy(enemy){
    const dx=enemy.x-player.x,dy=enemy.y-player.y;
    const angleToEnemy=Math.atan2(dx,-dy);let diff=angleToEnemy-player.angle;
    while(diff>Math.PI)diff-=Math.PI*2;while(diff<-Math.PI)diff+=Math.PI*2;
    const sideHit=Math.abs(diff)>1 && Math.abs(diff)<2.2;
    if(sideHit){player.damage+=0.5;enemy.damage+=25;enemy.fleeing=true;enemy.fleeTimer=180;enemy.slowTimer=60+Math.random()*120;
        if(enemy.damage>=100){enemy.alive=false;enemy.respawn=300;}} else {enemy.slowTimer=40+Math.random()*80;}
}

/* ===== PROPS ===== */
function spawnProp(){props.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,radius:8+Math.random()*10,life:300});}
function randomSpawnLoop(){spawnProp();setTimeout(randomSpawnLoop,1000+Math.random()*14000);}
randomSpawnLoop();
function propCollision(car){for(let i=props.length-1;i>=0;i--){const prop=props[i];const dx=car.x-prop.x,dy=car.y-prop.y;if(Math.hypot(dx,dy)<prop.radius+24){explosions.push({x:prop.x,y:prop.y,radius:15,life:40});props.splice(i,1);return;}}}
function updateProps(){for(let i=props.length-1;i>=0;i--){props[i].life--; if(props[i].life<=0) props.splice(i,1);}}
function updateExplosions(){for(let i=explosions.length-1;i>=0;i--){const e=explosions[i];e.radius+=8;e.life--; if(e.life<=0) explosions.splice(i,1);}}

function physics(){updatePlayer();updateEnemies();updateProps();updateExplosions();propCollision(player);
    enemies.forEach(enemy=>{if(!enemy.alive)return;propCollision(enemy);if(collide(player,enemy))damageEnemy(enemy);});
    for(let i=0;i<enemies.length;i++){for(let j=i+1;j<enemies.length;j++){if(!enemies[i].alive)continue;if(!enemies[j].alive)continue;collide(enemies[i],enemies[j]);}}
    if(player.damage>=100){player.deaths++;player.damage=0;player.x=canvas.width/2;player.y=canvas.height/2;player.vx=0;player.vy=0;}
}

/* ===== DRAW ===== */
function drawGrid(){ctx.strokeStyle="#3a3a3a";for(let x=0;x<canvas.width;x+=50){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,canvas.height);ctx.stroke();}for(let y=0;y<canvas.height;y+=50){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(canvas.width,y);ctx.stroke();}}
function drawCar(car,color){
    ctx.save();ctx.translate(car.x,car.y);ctx.rotate(car.angle);ctx.fillStyle=color;ctx.fillRect(-car.width/2,-car.height/2,car.width,car.height);
    ctx.fillStyle="#ff2222";ctx.fillRect(-car.width/2,-14,5,28);ctx.fillRect(car.width/2-5,-14,5,28);ctx.fillStyle="#88ccff";ctx.fillRect(-10,-20,20,15);ctx.restore();
    // draw chat bubble
    if(car.chat){
        ctx.save();
        ctx.translate(car.x,car.y-car.height/2-10);
        ctx.font="14px Arial";ctx.fillStyle="#ffffff";
        ctx.textAlign="center";ctx.fillText(car.chat,0,0);
        ctx.restore();
    }
}
function drawProps(){props.forEach(prop=>{ctx.beginPath();ctx.fillStyle="#888";ctx.arc(prop.x,prop.y,prop.radius,0,Math.PI*2);ctx.fill();});}
function drawExplosions(){explosions.forEach(e=>{ctx.beginPath();ctx.strokeStyle="rgba(255,180,0,"+(e.life/40)+")";ctx.lineWidth=6;ctx.arc(e.x,e.y,e.radius,0,Math.PI*2);ctx.stroke();});}
function render(){ctx.clearRect(0,0,canvas.width,canvas.height);drawGrid();drawProps();drawCar(player,"#ff4444");enemies.forEach(enemy=>{if(!enemy.alive)return;drawCar(enemy,enemy.fleeing?"#ffaa00":"#44ff44");});drawExplosions();
document.getElementById("damageFill").style.width=(100-player.damage)+"%";
document.getElementById("damageText").textContent=Math.floor(player.damage)+"%";
document.getElementById("deathText").textContent=player.deaths;
}

/* ===== MAIN LOOP ===== */
function loop(){physics();render();requestAnimationFrame(loop);}
loop();

/* ===== FETCH TUMBLR FEEDS ===== */
const feed1="https://api.rss2json.com/v1/api.json?rss_url="+encodeURIComponent("https://cantdanceflynn.tumblr.com/rss");
const feed2="https://api.rss2json.com/v1/api.json?rss_url="+encodeURIComponent("https://cometcrystal.tumblr.com/rss");
let feed1Titles=[],feed2Titles=[];
async function loadFeeds(){
    try{
        const res1=await fetch(feed1);const data1=await res1.json();
        feed1Titles=data1.items.map(i=>i.title||"Untitled");
        const res2=await fetch(feed2);const data2=await res2.json();
        feed2Titles=data2.items.map(i=>i.title||"Untitled");
        // assign chats
        player.chat=feed1Titles[Math.floor(Math.random()*feed1Titles.length)]||"Hi!";
        enemies.forEach((enemy,i)=>{
            if(i%2==0) enemy.chat=feed1Titles[Math.floor(Math.random()*feed1Titles.length)]||"Hello!";
            else enemy.chat=feed2Titles[Math.floor(Math.random()*feed2Titles.length)]||"Hey!";
        });
    }catch(e){console.error(e);}
}
loadFeeds();setInterval(loadFeeds,3000);
</script>

</body>
</html>
